name: 3D Animated Shorts Publisher

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish-3d:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install System Dependencies (FFmpeg & Chrome)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core xvfb
          if ! command -v google-chrome &> /dev/null; then
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update -qq
            sudo apt-get install -y google-chrome-stable
          fi

      - name: Cache AI Models (Kokoro & Whisper)
        id: cache-models
        uses: actions/cache@v4
        with:
          path: |
            ~/.faceless-shorts/kokoro
            ~/.cache/huggingface
          key: ai-models-v1-${{ runner.os }}

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy kokoro-onnx faster-whisper requests google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Pre-download Models (If Not Cached)
        if: steps.cache-models.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.faceless-shorts/kokoro
          echo "Downloading Kokoro TTS models with curl..."
          curl -L --retry 3 -o ~/.faceless-shorts/kokoro/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          curl -L --retry 3 -o ~/.faceless-shorts/kokoro/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          echo "Pre-caching Whisper small.en model..."
          python -c "from faster_whisper import WhisperModel; WhisperModel('small.en', device='cpu', compute_type='int8')"

      - name: Generate and Render 3D Video (Phase 1)
        id: render
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FPS: "30"
        run: |
          xvfb-run -a python pipeline_3d/main_3d.py --render-only

      - name: Create GitHub Release for Direct Video Hosting
        if: success()
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="3d-short-$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG_NAME" final_reel.mp4 --title "3D Short $TAG_NAME" --notes "Automated 3D Video Asset"
          VIDEO_URL="https://github.com/${{ github.repository }}/releases/download/$TAG_NAME/final_reel.mp4"
          echo "VIDEO_URL=$VIDEO_URL" >> $GITHUB_OUTPUT
          echo "Direct Public Video URL: $VIDEO_URL"

      - name: Publish to Social Platforms (Phase 2)
        if: success()
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python pipeline_3d/main_3d.py --publish-only "${{ steps.release.outputs.VIDEO_URL }}"

      - name: Clean Up Old Releases (Keep Latest 5)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OLD_RELEASES=$(gh release list --limit 100 --json tagName --jq '.[5:][].tagName')
          for TAG in $OLD_RELEASES; do
            echo "Deleting old release asset: $TAG"
            gh release delete "$TAG" --yes --cleanup-tag || true
          done

      - name: Commit and Push Updated 3D State
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline_3d/state_3d.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update 3D topic queue [skip ci]"
            git push
          fi
